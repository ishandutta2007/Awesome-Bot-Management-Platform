<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Dark Cyber Navy Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Badge Pill Purple Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Shield Blue Cyan Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    </pattern>

    <!-- Tech Radar Glow Circle -->
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16"/>

  <!-- Cyber Grid Overlay -->
  <rect width="1200" height="400" fill="url(#grid)" rx="16" opacity="0.8"/>

  <!-- Decorative Accent Glow (Right side radar target) -->
  <circle cx="1020" cy="200" r="160" fill="url(#radarGlow)"/>
  <circle cx="1020" cy="200" r="140" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="1020" cy="200" r="90" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="1020" cy="200" r="45" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.8"/>
  <circle cx="1020" cy="200" r="6" fill="#00f2fe"/>
  <line x1="1020" y1="40" x2="1020" y2="360" stroke="#0284c7" stroke-width="1" opacity="0.25"/>
  <line x1="860" y1="200" x2="1180" y2="200" stroke="#0284c7" stroke-width="1" opacity="0.25"/>

  <!-- Geometric Floating Tech Particles -->
  <circle cx="120" cy="70" r="4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="280" cy="330" r="5" fill="#ec4899" opacity="0.6"/>
  <circle cx="820" cy="80" r="6" fill="#8b5cf6" opacity="0.7"/>
  <circle cx="740" cy="320" r="4" fill="#00f2fe" opacity="0.8"/>
  <circle cx="930" cy="110" r="3" fill="#38bdf8" opacity="0.5"/>

  <!-- Security Shield Graphic (Left Decorative Element) -->
  <g transform="translate(75, 125)">
    <!-- Shield Outer Frame -->
    <path d="M 45 0 L 90 22 V 70 C 90 105 45 130 45 130 C 45 130 0 105 0 70 V 22 Z" fill="url(#shieldGrad)" opacity="0.95"/>
    <!-- Inner Shield Inset -->
    <path d="M 45 8 L 82 26 V 66 C 82 96 45 118 45 118 C 45 118 8 96 8 66 V 26 Z" fill="#0f172a" opacity="0.85"/>
    <!-- Checkmark / Lock Signal inside Shield -->
    <path d="M 28 62 L 40 74 L 64 44" fill="none" stroke="#00f2fe" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Category Pill Badge -->
  <g transform="translate(195, 75)">
    <rect width="320" height="34" rx="17" fill="url(#pillGrad)"/>
    <text x="160" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">CYBERSECURITY &amp; AI BOT DEFENSE</text>
  </g>

  <!-- Main Title Line 1 -->
  <text x="195" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="46" fill="#ffffff" letter-spacing="-0.5">Awesome Bot Management</text>

  <!-- Main Title Line 2 (Cyan Gradient accent text) -->
  <text x="195" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" fill="url(#cyanGrad)" letter-spacing="-0.5">&amp; Traffic Integrity Platform</text>

  <!-- Subtitle -->
  <text x="195" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" fill="#94a3b8">Curated SaaS Platforms, Open-Source Security &amp; AI Agent Governance</text>

  <!-- Secondary Footer Bar -->
  <line x1="195" y1="315" x2="780" y2="315" stroke="#334155" stroke-width="1.5"/>
  <text x="195" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#38bdf8" letter-spacing="0.5">Automated Threat Mitigation  •  Fingerprinting  •  WAF  •  Bot Analytics</text>
</svg>
