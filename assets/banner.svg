<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark Cyberpunk Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#07172b" />
      <stop offset="100%" stop-color="#0d0826" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Shield Accent Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Banner Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>
  </defs>

  <style>
    @keyframes gridPulse {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.35; }
    }
    @keyframes scanline {
      0% { transform: translateY(-400px); }
      100% { transform: translateY(400px); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-15px) scale(1.1); opacity: 0.8; }
      100% { transform: translateY(0px) scale(1); opacity: 0.3; }
    }
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .bg-grid {
      stroke: #00f2fe;
      stroke-width: 1;
      opacity: 0.2;
      animation: gridPulse 4s infinite ease-in-out;
    }
    .scan-line {
      stroke: url(#shieldGrad);
      stroke-width: 2;
      opacity: 0.4;
      animation: scanline 6s linear infinite;
    }
    .particle {
      animation: floatParticle 5s infinite ease-in-out;
    }
    .radar-sweep {
      transform-origin: 1050px 200px;
      animation: radarSpin 8s linear infinite;
    }
    
    /* Foreground elements - guaranteed high opacity & z-index ordering */
    .title-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #00f2fe;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #ffffff;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Grid Pattern Background -->
  <g class="bg-grid">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" />
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" />
  </g>

  <!-- Background Radar Visual (Right side dynamic element) -->
  <g opacity="0.25">
    <circle cx="1050" cy="200" r="140" fill="none" stroke="#00f2fe" stroke-width="1.5" />
    <circle cx="1050" cy="200" r="90" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="1050" cy="200" r="40" fill="none" stroke="#00f2fe" stroke-width="1" />
    <line class="radar-sweep" x1="1050" y1="200" x2="1190" y2="200" stroke="#00f2fe" stroke-width="3" />
  </g>

  <!-- Floating Glow Particles -->
  <circle class="particle" cx="150" cy="80" r="4" fill="#00f2fe" style="animation-delay: 0s;" />
  <circle class="particle" cx="850" cy="320" r="6" fill="#7928CA" style="animation-delay: 1.5s;" />
  <circle class="particle" cx="950" cy="90" r="5" fill="#FF0080" style="animation-delay: 2.5s;" />
  <circle class="particle" cx="220" cy="310" r="4" fill="#4facfe" style="animation-delay: 3.2s;" />

  <!-- Scanning Laser Beam -->
  <line class="scan-line" x1="0" y1="0" x2="1200" y2="0" />

  <!-- Shield Icon Graphic (Left Foreground Accent) -->
  <g transform="translate(80, 130)">
    <path d="M 40 0 L 80 20 V 60 C 80 90 40 110 40 110 C 40 110 0 90 0 60 V 20 Z" fill="url(#shieldGrad)" opacity="0.85" filter="url(#glow)" />
    <!-- Bot Bot Icon / Check inside Shield -->
    <path d="M 25 55 L 35 65 L 58 40" fill="none" stroke="#07172b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Main Category Pill Badge -->
  <g transform="translate(190, 85)">
    <rect width="280" height="32" rx="16" fill="url(#pillGrad)" opacity="0.9" />
    <text x="140" y="21" text-anchor="middle" class="badge-text">CYBERSECURITY &amp; AI BOT DEFENSE</text>
  </g>

  <!-- FOREGROUND TITLE & SUBTITLE (Unobstructed, crisp text) -->
  <g transform="translate(190, 175)">
    <text x="0" y="0" class="title-text" filter="url(#glow)">Awesome Bot Management</text>
    <text x="0" y="50" class="title-text" fill="#00f2fe">&amp; Traffic Integrity Platform</text>
    <text x="0" y="100" class="subtitle-text">Curated SaaS Products, Open-Source Detection Engines &amp; AI Agent Governance</text>
  </g>
</svg>
